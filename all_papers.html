  <head>
    <meta charset="utf-8">

    <link href="pages/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Dimensions badge script (will be loaded dynamically later for reliability) -->
    <!-- PlumX script (will be loaded dynamically later) -->
    <!-- Altmetric script (optional) -->
    <script type='text/javascript' src='https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js'></script>
  </head>

  <body>
    <br>
    <div class="container">
      <div class="jumbotron">
        <table width="100%"><tr><td width="90%">
          <div class='biofold'><span style="color:#c31e27;">Bio</span><span style="color:#4689a3;">molecules</span> <span style="color:#c31e27;">Fol</span><span style="color:#4689a3;">ding and </span><span style="color:#c31e27;">D</span><span style="color:#4689a3;">isease</span></div><br>
        </td><td width="10%">
          <div class="right_cell">
            <a href="http://biofold.org"><img src="pages/img/logo.png" width="75px" align="left"></a>
          </div>
        </td></tr></table>

        <table width="100%"><tr><td>
          <div class="form-inline justify-content-center">
            <nav>
              <ul class="nav nav-pills">
                <li><a href="index.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li class="active"><a href="papers.html">Publications</a></li>
                <li><a href="training.html">Training</a></li>
              </ul>
            </nav>
          </div>
        </td></tr></table>
        <br><br>

        <div id="publication-summary"></div>
        <br>
        <div id="publication-content"></div>

        <!-- Static citation links -->
        <div class="text"><h4 class="section">Citations</h4></div>
        <p class='text-justify'>
          <ul class="text">
            <li><a href="http://scholar.google.es/citations?user=qAa7Et0AAAAJ" target="_blank">Google Scholar</a></li>
            <br>
            <li><a href="http://www.scopus.com/authid/detail.url?authorId=8851983500" target="_blank">Scopus Preview</a></li>
            <br>
            <li><a href="https://www.webofscience.com/wos/author/record/D-9318-2011" target="_blank">ResearcherID</a></li>
          </ul>
        </p>
        <br><br>
        <div class='footer-ok'></div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------------
      // Utility: load external scripts on demand
      // ---------------------------------------------------------------------
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error('Failed to load ' + src));
          document.head.appendChild(s);
        });
      }

      // ---------------------------------------------------------------------
      // Fetch JSON and render
      // ---------------------------------------------------------------------
      fetch('ecapriotti.json')
        .then(response => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(data => {
          // Render content first (so papers appear even if summary has issues)
          renderContent(data.papers, data.chapters);
          renderSummary(data.summary);
          // Wait for badge scripts to load, then initialise badges
          return Promise.all([
            loadScript('https://badge.dimensions.ai/badge.js'),
            loadScript('//cdn.plu.mx/widget-popup.js')
          ]);
        })
        .then(() => {
          initBadges();
        })
        .catch(error => {
          console.error('Failed to load publications:', error);
          document.getElementById('publication-summary').innerHTML = '<p class="text">Error loading publication data.</p>';
          document.getElementById('publication-content').innerHTML = '';
        });

      // ---------------------------------------------------------------------
      // Helper functions
      // ---------------------------------------------------------------------

      function formatAuthors(authorStr) {
        if (!authorStr) return '';
        return authorStr.split(' and ').map(function(a) {
          a = a.trim();
          let match = a.match(/(.+?)([*†‡§]+)$/);
          let name = a, markers = '';
          if (match) {
            name = match[1].trim();
            markers = match[2];
          }
          let formatted = name;
          if (name.includes(',')) {
            let parts = name.split(',');
            let last = parts[0].trim();
            let firsts = parts[1].trim();
            let initials = firsts.split(' ').map(w => w.charAt(0).toUpperCase()).join('');
            formatted = last + ' ' + initials;
          } else {
            let words = name.split(' ');
            if (words.length >= 2) {
              let last = words.pop();
              let firsts = words.join(' ');
              let initials = firsts.split(' ').map(w => w.charAt(0).toUpperCase()).join('');
              formatted = last + ' ' + initials;
            }
          }
          if (formatted.startsWith('Capriotti E')) {
            formatted = '<b>' + formatted + '</b>';
          }
          if (markers) {
            formatted += markers.split('').map(m => m === '*' ? '*' : '<sup>' + m + '</sup>').join('');
          }
          return formatted;
        }).join(', ');
      }

      // Fallback badge builder (used only if p.badge_html is missing)
      function buildBadges(p) {
        let html = '';
        if (p.pmid) {
          html += '<a target="_blank" href="http://www.ncbi.nlm.nih.gov/pubmed/' + p.pmid + '"><img src="pages/img/pubmed.gif"></a> ';
        }
        if (p.pdf) {
          html += '<a href="' + p.pdf + '"><img width="15" src="pages/img/pdf.gif"></a> ';
        }
        if (p.doi) {
          if (p.scopus_citations > 0) {
            html += '<img src="https://img.shields.io/badge/Scopus-' + p.scopus_citations + '-blue?labelColor=orange&color=lightgrey" alt="Scopus"> ';
          }
          if (p.gs_citations > 0) {
            html += '<img src="https://img.shields.io/badge/GScholar-' + p.gs_citations + '-orange?labelColor=blue&color=lightgrey" alt="Google Scholar"> ';
          }
          if (p.jif || p.five_year_jif || p.max_percentile) {
            let parts = [];
            if (p.jif) parts.push('Current:' + p.jif);
            if (p.five_year_jif) parts.push('5Y:' + p.five_year_jif);
            if (p.max_percentile && p.max_category) parts.push('Max%:' + p.max_percentile + ' (' + p.max_category + ')');
            else if (p.max_percentile) parts.push('Max%:' + p.max_percentile);
            let msg = encodeURIComponent(parts.join(' | '));
            html += '<img src="https://img.shields.io/badge/JCR-' + msg + '-purple" alt="JCR"> ';
          }
          html += '<span class="__dimensions_badge_embed__" data-doi="' + p.doi + '" data-hide-zero-citations="false" data-style="small_rectangle" style="display:inline-block;"></span> ';
          html += '<span style="display:inline-block;"><a href="https://plu.mx/plum/a/?doi=' + p.doi + '" class="plumx-plum-print-popup" data-size="tiny" data-popup="right" data-badge="true" data-hide-when-empty="false"></a></span>';
        }
        return html;
      }

      function buildItem(p, isChapter) {
        let authorsHtml = formatAuthors(p.authors);
        let citation = '<i>' + authorsHtml + '</i> (' + p.year + '). ' + p.title + '. <b>' + (isChapter ? p.booktitle : p.journal) + '</b>';
        if (p.volume) citation += ' ' + p.volume;
        if (p.issue) citation += '(' + p.issue + ')';
        if (p.pages) citation += ':' + p.pages;
        citation += '.';
        if (p.doi) citation += ' DOI:' + p.doi;

        // Use pre-rendered badge_html if available, else fallback
        let badges = p.badge_html ? p.badge_html : buildBadges(p);

        return '<li class="text" value="' + p.number + '" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;">' +
               '<p class="text-justify">' + citation + '<br>' + badges + '</p></li>';
      }

      // ---------------------------------------------------------------------
      // Rendering functions
      // ---------------------------------------------------------------------

      function renderSummary(s) {
        if (!s) {
          document.getElementById('publication-summary').innerHTML = '<p class="text">Summary data not available.</p>';
          return;
        }
        let html = '<p class="text">Since 2004 we have published <strong>' + s.total_papers + '</strong> peer-reviewed papers (<strong>' + s.total_articles + '</strong> research articles and <strong>' + s.total_reviews + '</strong> reviews) in international journals with impact factor, and <strong>' + s.total_chapters + '</strong> book chapters. More details about the selected manuscripts are reported below.<br><br>';
        html += '<strong>Total Scopus Citations:</strong> ' + s.total_scopus_citations + ' | <strong>Scopus h-index:</strong> ' + s.h_scopus;
        html += '<br><strong>Total Google Scholar Citations:</strong> ' + s.total_gs_citations + ' | <strong>Google Scholar h-index:</strong> ' + s.h_gs;
        if (s.jcr && s.jcr.num_with_jcr_data > 0) {
          html += '<br><b>JCR Manuscripts</b>: ' + s.jcr.num_with_jcr_data + ' | <b>Avg JIF</b>: ' + s.jcr.avg_jif.toFixed(2) + ' | <b>Avg 5Y JIF</b>: ' + s.jcr.avg_five_year_jif.toFixed(2) + ' | <b>Avg Max%</b>: ' + s.jcr.avg_max_percentile.toFixed(1);
        }
        html += '</p>';
        document.getElementById('publication-summary').innerHTML = html;
      }

      function renderContent(papers, chapters) {
        let content = '';
        let groups = {};
        papers.forEach(p => {
          let y = p.year || 'Unknown';
          if (!groups[y]) groups[y] = [];
          groups[y].push(p);
        });
        let years = Object.keys(groups).sort().reverse();
        years.forEach(y => {
          content += '<div class="text"><h4 class="section">' + y + '</h4></div>';
          content += '<table cellpadding="7" cellspacing="7" class="paper"><tbody><tr><td><ol>';
          groups[y].forEach(p => {
            content += buildItem(p, false);
          });
          content += '</ol></td></tr></tbody></table>';
        });
        if (chapters.length) {
          content += '<div class="text"><h4 class="section">Book chapters</h4></div>';
          content += '<table cellpadding="7" cellspacing="7" class="paper"><tbody><tr><td><ol>';
          chapters.forEach(p => {
            content += buildItem(p, true);
          });
          content += '</ol></td></tr></tbody></table>';
        }
        document.getElementById('publication-content').innerHTML = content;
      }

      // ---------------------------------------------------------------------
      // Initialize badges after DOM is ready and scripts are loaded
      // ---------------------------------------------------------------------
      function initBadges() {
        // Dimensions
        if (window.__dimensions_embed) {
          try {
            window.__dimensions_embed();
          } catch (e) {
            console.error('Dimensions embed failed:', e);
          }
        }

        // PlumX (correct method)
        if (window.PlumX && window.PlumX.widgets) {
          try {
            window.PlumX.widgets.render();
          } catch (e) {
            console.error('PlumX render failed:', e);
          }
        }
      }

      // Also initialize on window load (as a fallback)
      window.addEventListener('load', initBadges);
    </script>
  </body>
</html>
